name: AlphaZee CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: alphazee_ci_bootstrap
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U ci -d alphazee_ci_bootstrap'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-disposable-only@127.0.0.1:5432/alphazee_ci_bootstrap
      # Existing suite explicitly exercises local provisioning; DB remains disposable.
      APP_ENV: development
      DEBUG: 'false'
      TEST_CHECKOUT_ENABLED: 'false'
      CATALOG_MEDIA_ROOT: /tmp/alphazee-ci-media
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python backend/scripts/run_isolated_verification.py
      - run: python ops/ci_migrations.py
      - run: python backend/scripts/verify_vf_integration_migration.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: backend-failure
          path: .local/vf-terminal-verification.xml
          retention-days: 7
          if-no-files-found: ignore
  operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s ops/tests -v
      - run: python3 ops/check_workflows.py
      - name: Validate workflow schema and shell expressions
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker build -t alphazee-ci-api --build-arg RELEASE_SHA="$GITHUB_SHA" backend
      - run: docker build --target production -t alphazee-ci-web --build-arg RELEASE_SHA="$GITHUB_SHA" frontend
      - name: Production preflight and Compose validation
        run: python3 ops/ci_packaging.py
      - name: Browser smoke against production static image
        run: |
          docker run -d --name ci-web -p 8080:80 -e SITE_DOMAIN=:80 alphazee-ci-web
          npm install --prefix /tmp/browser-ci --no-package-lock playwright@1.58.2
          /tmp/browser-ci/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/browser-ci/node_modules node ops/browser_smoke.cjs
  ci-required:
    if: always()
    needs: [frontend, backend, operations, packaging]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; assert all(j["result"] == "success" for j in json.loads(os.environ["RESULTS"]).values()), "A required check failed or was cancelled"'
  release:
    needs: ci-required
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
