name: ${COMPOSE_PROJECT_NAME:-alphazee-prod}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    image: alphazee-api:${IMAGE_TAG:-local}
    build: ./backend
    environment:
      <<: &api_environment
        DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using the db service hostname}
        APP_ENV: production
        DEBUG: "false"
        TEST_CHECKOUT_ENABLED: "false"
        ALLOWED_ORIGINS: https://${SITE_DOMAIN:?Set SITE_DOMAIN}
        SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
        BANK_NAME: ${BANK_NAME:-}
        BANK_ACCOUNT_TITLE: ${BANK_ACCOUNT_TITLE:-}
        BANK_ACCOUNT_NUMBER: ${BANK_ACCOUNT_NUMBER:-}
        BANK_IBAN: ${BANK_IBAN:-}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    command: ["sh", "-c", "python scripts/check_production_deployment.py && alembic upgrade head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: alphazee-api:${IMAGE_TAG:-local}
    build: ./backend
    environment: *api_environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: alphazee-web:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      target: production
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
