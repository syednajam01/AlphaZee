# docker-compose.yml — Local development services for AlphaZee.
# Purpose: provide a disposable PostgreSQL instance for development and testing.
# Production databases are managed separately on Azure — do not use this file
# in any production or staging context.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alphazee
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: alphazee_dev
    ports:
      # Expose PostgreSQL on the default local port.
      # Only bind to localhost — not reachable from outside the machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alphazee -d alphazee_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    driver: local
